name: Monorepo CI and Deploy (Build & Push Image)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"

# 1. CẤP QUYỀN GHI VÀO GITHUB PACKAGES (BẮT BUỘC)
permissions:
  contents: read
  packages: write

jobs:
  # --- JOB DEPLOY CHO BACKEND ---
  backend-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Backend changes
        id: check_backend
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "^backend/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # 2. ĐĂNG NHẬP VÀO GHCR (Dùng token tự động của GitHub)
      - name: Login to GHCR
        if: steps.check_backend.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. BUILD VÀ PUSH IMAGE BACKEND LÊN GHCR
      - name: Build and Push Backend Image
        if: steps.check_backend.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # Tên image sẽ là: ghcr.io/tên-user/tên-repo/backend:latest
          tags: ghcr.io/${{ github.repository }}/backend:latest

      - name: Trigger Backend Coolify
        if: steps.check_backend.outputs.changed == 'true'
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL_BACKEND }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

  # --- JOB DEPLOY CHO FRONTEND ---
  frontend-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Frontend changes
        id: check_frontend
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "^frontend/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        if: steps.check_frontend.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. BUILD VÀ PUSH IMAGE FRONTEND LÊN GHCR
      - name: Build and Push Frontend Image
        if: steps.check_frontend.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest

      - name: Trigger Frontend Coolify
        if: steps.check_frontend.outputs.changed == 'true'
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL_FRONTEND }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
