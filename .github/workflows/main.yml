name: Monorepo CI and Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  # --- JOB BACKEND ---
  backend-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Quan trọng để so sánh các thay đổi giữa 2 commit

      - name: Check for Backend changes
        id: check_backend
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "^backend/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and Trigger Backend
        if: steps.check_backend.outputs.changed == 'true'
        run: |
          echo "Backend changed, starting build..."
          cd backend && npm install && npm run build
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

  # --- JOB FRONTEND ---
  frontend-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Frontend changes
        id: check_frontend
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "^frontend/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and Trigger Frontend
        if: steps.check_frontend.outputs.changed == 'true'
        run: |
          echo "Frontend changed, starting build..."
          cd frontend && npm install && npm run build
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL_FRONTEND }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'