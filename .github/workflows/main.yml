name: Monorepo CI and Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  # --- JOB BACKEND ---
  backend-deploy:
    if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'backend/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Build Check Backend
        working-directory: ./backend
        run: |
          npm install
          npm run build

      - name: Trigger Backend Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL_BACKEND }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

  # --- JOB FRONTEND (NEXT.JS) ---
  frontend-deploy:
    if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'frontend/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Check Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Trigger Frontend Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL_FRONTEND }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
